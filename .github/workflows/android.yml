name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_user:
        description: "Throwaway test account username (signed-in smoke test)"
        required: false
      test_pass:
        description: "Its password"
        required: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # to publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: Web parity (fixtures match the web app's current rules)
        run: |
          git clone --depth 1 https://github.com/Ozovehe1/benchjot.git /tmp/web
          node --experimental-strip-types scripts/web-fixtures.mjs /tmp/web
          git diff --exit-code -- core/src/test/resources/web || { echo "::error::The web app's rules changed. Run scripts/web-fixtures.mjs, update core to match, commit."; exit 1; }

      - name: Unit tests
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: On-device runner test (runner.html against the live web workers, in Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.48.2
          npx playwright install --with-deps chromium
          node scripts/runner-test.mjs

      - name: Upload APK (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: benchjot-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk benchjot.apk
          gh release create "$TAG" benchjot.apk \
            --title "Benchjot for Android 0.1.${GITHUB_RUN_NUMBER}" \
            --notes "Built from ${GITHUB_SHA::7}. Install benchjot.apk on your phone (allow installs from your browser or Files app). Signed with the repo's sideload key, so each build installs over the last." \
            --latest

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: benchjot-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Mask test account
        if: ${{ inputs.test_pass != '' }}
        run: echo "::add-mask::${{ inputs.test_pass }}"
      - name: Emulator smoke test
        env:
          BJ_USER: ${{ inputs.test_user }}
          BJ_PASS: ${{ inputs.test_pass }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: bash scripts/smoke.sh app-release.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-screenshots
          path: smoke/
